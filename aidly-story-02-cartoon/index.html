<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aidly PMS – Animated Pharmacy Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #0a0f18;
  font-family: "Noto Sans Bengali", "Plus Jakarta Sans", system-ui, sans-serif;
  color: #fff;
}
.stage {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #0a0f18;
}
svg { width: 100%; height: 100%; display: block; }
svg text { text-anchor: middle; font-weight: 800; }
/* Progress bar at top */
.bar {
  position: absolute;
  left: 0;
  top: 0;
  height: 14px;
  background: #10b981;
  width: 0%;
  z-index: 50;
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
}
/* Live caption box at bottom */
.cap {
  position: absolute;
  left: 60px;
  right: 60px;
  bottom: 60px;
  background: rgba(0, 0, 0, 0.82);
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  border-radius: 28px;
  padding: 24px 36px;
  text-align: center;
  font-weight: 700;
  font-size: 32px;
  line-height: 1.45;
  color: #fff;
  z-index: 40;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(16px);
}
</style>
</head>
<body>
<div
  class="stage"
  data-composition-id="main"
  data-start="0"
  data-duration="30"
  data-width="1080"
  data-height="1920"
  data-fps="30"
>
  <div class="bar" id="bar"></div>

  <!-- Synchronized Audio Track -->
  <audio id="voiceover" src="./assets/voiceover.mp3" data-start="0" data-duration="30"></audio>

  <!-- Main Animated SVG Scene (ViewBox 0 0 540 960 scaled to 1080x1920) -->
  <svg id="v" viewBox="0 0 540 960">
    <!-- Pharmacy Store Interior -->
    <rect width="540" height="770" fill="#e6f2ef"/>
    <rect y="770" width="540" height="190" fill="#c3d3cf"/>

    <!-- Pharmacy Signboard -->
    <rect x="225" y="38" width="90" height="70" rx="14" fill="#10b981"/>
    <rect x="263" y="50" width="14" height="46" fill="#fff"/>
    <rect x="247" y="66" width="46" height="14" fill="#fff"/>
    <text x="270" y="130" font-size="18" fill="#0b4a3a">ফার্মেসি</text>

    <!-- Medicine Shelves & Products -->
    <g id="shelf"></g>
    <g id="marks"></g>

    <!-- Customers in queue -->
    <g id="cs"></g>

    <!-- Pharmacist / Cashier behind the counter -->
    <g id="cashier" class="cashier">
      <rect x="458" y="488" width="54" height="90" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <rect x="481" y="512" width="8" height="24" fill="#10b981"/>
      <rect x="473" y="520" width="24" height="8" fill="#10b981"/>
      <circle cx="485" cy="466" r="21" fill="#e0b48a"/>
      <path d="M464 464a21 21 0 0 1 42 0z" fill="#2b2118"/>
      <circle cx="478" cy="468" r="2" fill="#222"/>
      <circle cx="492" cy="468" r="2" fill="#222"/>
      <!-- Happy Mouth -->
      <path id="mouth-ok" d="M477 477q8 7 16 0" stroke="#222" stroke-width="2" fill="none" opacity="0"/>
      <!-- Stressed Face -->
      <g id="face-bad" opacity="1">
        <path d="M472 460l10 4M498 460l-10 4" stroke="#222" stroke-width="2"/>
        <path d="M477 481q8-6 16 0" stroke="#222" stroke-width="2" fill="none"/>
        <text id="sweat" x="462" y="450" font-size="16">💦</text>
      </g>
    </g>

    <!-- Pharmacy Counter -->
    <rect x="285" y="568" width="255" height="202" fill="#8a5a3b"/>
    <rect x="278" y="558" width="262" height="16" rx="4" fill="#b98259"/>

    <!-- POS Monitor -->
    <rect x="352" y="548" width="30" height="10" fill="#475569"/>
    <rect x="322" y="470" width="90" height="62" rx="8" fill="#1e293b"/>
    <rect x="328" y="476" width="78" height="50" rx="4" fill="#0f172a"/>

    <!-- Red Screen / Hang Spinner (Scene 1-2) -->
    <g id="screen-hang" opacity="1">
      <rect x="328" y="476" width="78" height="50" rx="4" fill="#7f1d1d"/>
      <circle id="spinner" cx="367" cy="501" r="12" fill="none" stroke="#fca5a5" stroke-width="4" stroke-dasharray="40 40"/>
    </g>

    <!-- Green Screen / Fast Checkmark (Scene 3+) -->
    <g id="screen-pos" opacity="0">
      <rect x="328" y="476" width="78" height="50" rx="4" fill="#047857"/>
      <rect x="351" y="484" width="10" height="26" fill="#fff"/>
      <rect x="343" y="492" width="26" height="10" fill="#fff"/>
      <text x="385" y="508" font-size="22" fill="#fff">✓</text>
    </g>

    <!-- Thermal Printer & Spitting Receipts -->
    <rect id="receipt" x="424" y="520" width="22" height="26" fill="#fff" stroke="#cbd5e1" opacity="0"/>
    <rect x="416" y="540" width="40" height="20" rx="4" fill="#334155"/>

    <!-- Barcode Scanner & Laser Beam (Scene 4) -->
    <g id="scanner" opacity="0">
      <rect x="296" y="528" width="20" height="26" rx="3" fill="#f59e0b"/>
      <rect x="300" y="532" width="12" height="3" fill="#fff"/>
      <rect x="296" y="542" width="26" height="14" rx="4" fill="#334155"/>
      <line id="laser" x1="288" y1="541" x2="330" y2="541" stroke="#ef4444" stroke-width="3"/>
    </g>

    <!-- 3-Second Ring Badge (Scene 4) -->
    <g id="ring3s" opacity="0">
      <circle cx="365" cy="425" r="24" fill="#0b1220"/>
      <circle id="ring-circ" cx="365" cy="425" r="22" fill="none" stroke="#2fe0a0" stroke-width="5" stroke-dasharray="138" stroke-dashoffset="138" transform="rotate(-90 365 425)"/>
      <text x="365" y="431" font-size="15" fill="#fff">৩সে.</text>
    </g>

    <!-- Expiry Alert Screen Notification (Scene 5) -->
    <g id="note-expiry" opacity="0">
      <rect x="295" y="395" width="160" height="38" rx="12" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
      <text x="375" y="420" font-size="14" fill="#fcd34d">🔔 ৩০ দিন বাকি</text>
    </g>

    <!-- Night Ambient Tint Overlay (Scenes 1 & 2) -->
    <rect id="night-overlay" width="540" height="960" fill="#0b1030" opacity="0.42"/>

    <!-- Evening Badge (Scene 1) -->
    <g id="badge-night" opacity="1">
      <rect x="372" y="150" width="144" height="34" rx="17" fill="#7f1d1d"/>
      <text x="444" y="173" font-size="16" fill="#fff">🌙 রাত ৮:১৫</text>
    </g>

    <!-- Floating Aidly Logo Reveal (Scene 3) -->
    <g id="logo-popup" opacity="0">
      <rect x="95" y="215" width="350" height="110" rx="26" fill="#0b1220" stroke="#2fe0a0" stroke-width="3"/>
      <rect x="125" y="241" width="58" height="58" rx="14" fill="#10b981"/>
      <rect x="148" y="252" width="12" height="36" fill="#fff"/>
      <rect x="136" y="264" width="36" height="12" fill="#fff"/>
      <text x="320" y="282" font-size="36" fill="#fff">Aidly PMS</text>
    </g>

    <!-- Final Call to Action Modal (Scene 6) -->
    <g id="cta-modal" opacity="0">
      <rect x="40" y="170" width="460" height="225" rx="26" fill="#0b1220" opacity="0.96"/>
      <text x="270" y="228" font-size="30" fill="#fff">ফাস্ট কাউন্টার।</text>
      <text x="270" y="270" font-size="30" fill="#2fe0a0">ক্লিয়ার হিসাব।</text>
      <g id="cta-btn">
        <rect x="70" y="294" width="400" height="50" rx="25" fill="#10b981"/>
        <text x="270" y="327" font-size="19" fill="#fff">ফ্রি ডেমোর জন্য কমেন্ট করুন “AIDLY”</text>
      </g>
      <text x="270" y="372" font-size="14" fill="#94a3b8">🌐 infoaidtech.net • Info AidTech</text>
    </g>
  </svg>

  <div class="cap" id="cap">রাত আটটা পনেরো। দশজন কাস্টমার সিরিয়ালে। বিলিং স্ক্রিন হ্যাং!</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const SH = ['#ef4444','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b'];
  const SK = ['#f2c9a0','#d9a577','#b8825a','#8d5a3a'];

  // 1. Build Customers
  $('cs').innerHTML = Array.from({ length: 8 }, (_, i) => `
    <g id="cust-${i}" transform="translate(${270 - i * 34}, 800) scale(.9)">
      <g id="cust-mv-${i}">
        <g id="cust-fid-${i}">
          <rect x="-10" y="-34" width="8" height="34" fill="#2b3a55"/>
          <rect x="2" y="-34" width="8" height="34" fill="#2b3a55"/>
          <rect x="-15" y="-84" width="30" height="54" rx="12" fill="${SH[i]}"/>
          <rect x="-22" y="-80" width="8" height="38" rx="4" fill="${SH[i]}"/>
          <rect x="14" y="-80" width="8" height="38" rx="4" fill="${SH[i]}"/>
          <circle cy="-100" r="15" fill="${SK[i % 4]}"/>
          <path d="M-15-102a15 15 0 0 1 30 0z" fill="#2b2118"/>
          <circle cx="-5" cy="-99" r="1.7" fill="#222"/>
          <circle cx="5" cy="-99" r="1.7" fill="#222"/>
          <path id="cust-mouth-ok-${i}" d="M-5-92q5 5 10 0" stroke="#222" stroke-width="1.6" fill="none" opacity="0"/>
          <g id="cust-face-bad-${i}" opacity="1">
            <path d="M-9-107l7 3M9-107l-7 3" stroke="#222" stroke-width="1.8"/>
            <path d="M-5-90q5-4 10 0" stroke="#222" stroke-width="1.6" fill="none"/>
            <text x="16" y="-114" font-size="14">💢</text>
          </g>
        </g>
      </g>
    </g>
  `).join('');

  // 2. Build Shelves
  const BP = ['#60a5fa','#34d399','#fbbf24','#f472b6','#a78bfa','#fb923c','#2dd4bf'];
  let sh = '', xs = [];
  [215, 305, 395].forEach((y, r) => {
    sh += `<rect x="14" y="${y}" width="512" height="8" rx="3" fill="#a9795a"/>`;
    let x = 22, k = 0;
    while (x < 500) {
      const w = 26 + ((k * 7 + r * 5) % 4) * 6;
      const h = 36 + ((k * 11 + r * 3) % 5) * 6;
      const xb = (r === 1 && k >= 3 && k <= 5);
      sh += `<rect id="box-${r}-${k}" x="${x}" y="${y - h}" width="${w}" height="${h}" rx="4" fill="${BP[(k + r * 3) % 7]}"/>`;
      sh += `<rect x="${x + 4}" y="${y - h + 8}" width="${w - 8}" height="6" rx="2" fill="#ffffffaa"/>`;
      if (xb) xs.push(x + w / 2);
      x += w + 8;
      k++;
    }
  });
  $('shelf').innerHTML = sh;

  // 3. Build Marks & Coins
  $('marks').innerHTML = xs.map((x, i) => `<text id="mark-x-${i}" x="${x}" y="292" font-size="22" fill="#ef4444" opacity="0">✕</text>`).join('')
    + xs.concat(xs).map((x, i) => `<text id="coin-${i}" x="${x + (i % 2 ? 10 : -10)}" y="260" font-size="22" fill="#d97706" opacity="0">৳</text>`).join('')
    + `<g id="bell-group" opacity="0"><g id="bell"><text x="${xs[1]}" y="238" font-size="30">🔔</text></g></g>`;

  // 4. Register Paused GSAP Timeline
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Top Progress Bar
  tl.to("#bar", { width: "100%", duration: 30.0, ease: "none" }, 0);

  // Synchronized Caption Lines
  tl.call(() => { $('cap').textContent = "রাত আটটা পনেরো। দশজন কাস্টমার সিরিয়ালে। বিলিং স্ক্রিন হ্যাং!"; }, null, 0.0);
  tl.call(() => { $('cap').textContent = "ট্যাবের ঝামেলায় কাস্টমার লস। আর এক্সপায়ার্ড স্টকে লাভ লস। প্রতি মাসে হাজার হাজার টাকা গচ্চা!"; }, null, 4.6);
  tl.call(() => { $('cap').textContent = "সমাধান, এইডলি পি এম এস। পিক আওয়ারের ভিড়েও আপনার কাউন্টার আর আটকাবে না।"; }, null, 9.5);
  tl.call(() => { $('cap').textContent = "মাল্টি স্ক্রিন পি ও এস, সুপারফাস্ট চেকআউট। মাত্র তিন সেকেন্ডে বিলিং।"; }, null, 13.5);
  tl.call(() => { $('cap').textContent = "আগেভাগেই সতর্কতা, এক টাকাও লস নয়। মেয়াদ শেষ হতে ত্রিশ দিন বাকি থাকতেই অটো অ্যালার্ট।"; }, null, 18.5);
  tl.call(() => { $('cap').textContent = "ফাস্ট কাউন্টার, ক্লিয়ার হিসাব। ফ্রি ডেমোর জন্য কমেন্ট করুন, এইডলি।"; }, null, 22.8);

  // Pharmacist Bobbing & Fidgeting
  tl.to("#cashier", { y: -4, repeat: 28, yoyo: true, duration: 0.5, ease: "sine.inOut" }, 0);
  for (let i = 0; i < 8; i++) {
    tl.to(`#cust-fid-${i}`, { rotation: (i % 2 === 0 ? 3 : -3), repeat: 8, yoyo: true, duration: 0.35, ease: "sine.inOut" }, 0);
  }

  // Monitor Spinner (Scenes 1-2)
  tl.to("#spinner", { rotation: 1080, transformOrigin: "center center", duration: 4.6, ease: "none" }, 0);

  // ==========================================
  // SCENE 2: The Silent Cost (4.6s - 9.5s)
  // ==========================================
  // Customers leave in frustration
  for (let i = 0; i < 8; i++) {
    tl.to(`#cust-mv-${i}`, { x: -440, duration: 2.2, ease: "power2.in" }, 4.6 + i * 0.15);
  }
  // Expired batch red marks appear & money flies away
  for (let i = 0; i < xs.length; i++) {
    tl.to(`#mark-x-${i}`, { opacity: 1, duration: 0.3 }, 4.8);
  }
  for (let i = 0; i < xs.length * 2; i++) {
    tl.fromTo(`#coin-${i}`, { opacity: 1, y: 0 }, { opacity: 0, y: -160, duration: 2.0, repeat: 1, ease: "power1.out" }, 5.0 + (i * 0.2));
  }
  // Red crosses fade out at end of scene 2
  for (let i = 0; i < xs.length; i++) {
    tl.to(`#mark-x-${i}`, { opacity: 0, duration: 0.3 }, 9.3);
  }

  // ==========================================
  // SCENE 3: The Turn: Meet Aidly PMS (9.5s - 13.5s)
  // ==========================================
  // Transition night overlay to daytime store brightness
  tl.to("#night-overlay", { opacity: 0, duration: 0.8 }, 9.5);
  tl.to("#badge-night", { opacity: 0, duration: 0.3 }, 9.5);

  // Happy pharmacist face
  tl.to("#face-bad", { opacity: 0, duration: 0.3 }, 9.5);
  tl.to("#mouth-ok", { opacity: 1, duration: 0.3 }, 9.5);

  // POS monitor turns green with checkmark
  tl.to("#screen-hang", { opacity: 0, duration: 0.2 }, 9.5);
  tl.to("#screen-pos", { opacity: 1, duration: 0.3 }, 9.5);

  // Aidly Logo Pops In
  tl.fromTo("#logo-popup", { scale: 0.3, opacity: 0, transformOrigin: "center center" }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 9.5);
  tl.to("#logo-popup", { opacity: 0, scale: 0.9, duration: 0.3 }, 13.2);

  // Customers happily re-enter
  for (let i = 0; i < 8; i++) {
    tl.to(`#cust-face-bad-${i}`, { opacity: 0, duration: 0.2 }, 9.5);
    tl.to(`#cust-mouth-ok-${i}`, { opacity: 1, duration: 0.2 }, 9.5);
    tl.to(`#cust-mv-${i}`, { x: 0, duration: 1.6, ease: "power2.out" }, 9.8 + (i * 0.1));
  }

  // ==========================================
  // SCENE 4: Fast POS Billing Demo (13.5s - 18.5s)
  // ==========================================
  // Scanner & 3-second ring appear
  tl.to("#scanner", { opacity: 1, duration: 0.3 }, 13.5);
  tl.to("#ring3s", { opacity: 1, duration: 0.3 }, 13.5);
  tl.fromTo("#ring-circ", { strokeDashoffset: 138 }, { strokeDashoffset: 0, duration: 4.5, ease: "linear" }, 13.6);
  tl.to("#laser", { opacity: 0.2, repeat: 14, yoyo: true, duration: 0.15 }, 13.6);

  // Spitting receipt animation
  tl.fromTo("#receipt", { opacity: 0, y: 15 }, { opacity: 1, y: -20, repeat: 3, duration: 0.9, ease: "power1.out" }, 13.8);

  // Serve the first 4 customers rapidly!
  for (let i = 0; i < 4; i++) {
    tl.to(`#cust-mv-${i}`, { y: 160, scale: 1.15, opacity: 0, duration: 0.9, ease: "power2.in" }, 14.2 + (i * 0.9));
  }
  // Remaining queue steps up to the counter
  for (let i = 4; i < 8; i++) {
    tl.to(`#cust-mv-${i}`, { x: 136, duration: 0.8, ease: "power2.out" }, 17.5);
  }

  // Exit scene 4 elements
  tl.to("#scanner", { opacity: 0, duration: 0.3 }, 18.0);
  tl.to("#ring3s", { opacity: 0, duration: 0.3 }, 18.0);
  tl.to("#receipt", { opacity: 0, duration: 0.2 }, 18.0);

  // ==========================================
  // SCENE 5: Expiry FEFO Alert (18.5s - 22.8s)
  // ==========================================
  tl.to("#bell-group", { opacity: 1, duration: 0.3 }, 18.5);
  tl.to("#bell", { rotation: 15, transformOrigin: "50% 0%", repeat: 8, yoyo: true, duration: 0.2, ease: "sine.inOut" }, 18.6);
  tl.fromTo("#note-expiry", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 18.6);
  tl.to("#bell-group", { opacity: 0, duration: 0.3 }, 22.5);
  tl.to("#note-expiry", { opacity: 0, duration: 0.3 }, 22.5);

  // ==========================================
  // SCENE 6: Payoff & Call to Action (22.8s - 30.0s)
  // ==========================================
  tl.fromTo("#cta-modal", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 22.8);
  tl.to("#cta-btn", { scale: 1.06, transformOrigin: "center center", repeat: 8, yoyo: true, duration: 0.55, ease: "sine.inOut" }, 23.4);

  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
