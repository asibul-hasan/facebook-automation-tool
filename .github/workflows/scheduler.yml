name: Facebook Page Post Scheduler

on:
  schedule:
    # Launch Run: Today Nov 21, 2026 at 03:00 PM BST (09:00 UTC) - Aidly PMS 3D Story
    - cron: '0 9 * * *'
    # Daily Recurring Cadence: Every Day at 11:00 AM BST (05:00 UTC) - Alternating Queue
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI

# Required permissions to commit and push changes back to the repository
permissions:
  contents: write

jobs:
  publish:
    name: Publish Next Scheduled Post
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to ensure clean merges/rebases when pushing back
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Multi-Platform Publisher
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: |
          CURRENT_HOUR_UTC=$(date -u +'%H')
          CURRENT_DATE=$(date -u +'%Y-%m-%d')
          echo "Current UTC Hour: $CURRENT_HOUR_UTC | Current UTC Date: $CURRENT_DATE"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$CURRENT_HOUR_UTC" = "09" ] || [ "$CURRENT_HOUR_UTC" = "08" ] || [ "$CURRENT_HOUR_UTC" = "10" ]; } && [ "$CURRENT_DATE" != "2026-11-21" ]; then
            echo "Notice: 09:00 UTC (3:00 PM BST) slot was configured for launch date 2026-11-21 only."
            echo "Regular recurring schedule runs daily at 05:00 UTC (11:00 AM BST). Skipping execution."
            exit 0
          fi
          python post_to_fb.py

      - name: Commit and push updated posts queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json

          # Verify if changes exist before creating a commit
          if git diff --staged --quiet; then
            echo "No changes in posts.json detected. Skipping git commit."
          else
            git commit -m "chore(queue): mark post as published [skip ci]"
            # Pull latest changes to avoid non-fast-forward conflicts
            git pull --rebase
            git push
          fi
